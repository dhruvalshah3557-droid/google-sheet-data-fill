name: Auto Sync Google Sheet

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread oauth2client

      - name: Restore service account key
        env:
          SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY secret is empty. Set it to the base64 of your service account key JSON."
            exit 1
          fi
          # Accept either base64 or raw JSON (whitespace/newlines tolerated).
          # Strip any stray non-base64 chars that can sneak in when copying
          # a wrapped long line (dashes, unicode, etc.).
          SA_KEY=$(printf '%s' "$SA_KEY" | tr -d '[:space:]' | tr -cd 'A-Za-z0-9+/=')
          echo "Secret trimmed length: ${#SA_KEY}"
          echo "Secret first 2 chars: ${SA_KEY:0:2}"
          echo "Secret last 4 chars: ${SA_KEY: -4}"
          if [ "${SA_KEY:0:1}" = "{" ]; then
            printf '%s\n' "$SA_KEY" > /tmp/sa-key.json
          else
            # Restore base64 padding (=) lost during copy/paste
            while [ $(( ${#SA_KEY} % 4 )) -ne 0 ]; do SA_KEY="${SA_KEY}="; done
            printf '%s' "$SA_KEY" | base64 -d > /tmp/sa-key.json || {
              echo "::error::Secret is not valid base64 and not raw JSON. Set GOOGLE_SERVICE_ACCOUNT_KEY to base64 -w0 of your service account key JSON."
              exit 1
            }
          fi
          python -c "import json; json.load(open('/tmp/sa-key.json'))" || {
            echo "::error::Restored key is not valid JSON."
            exit 1
          }
          chmod 600 /tmp/sa-key.json

      - name: Sync spreadsheet
        env:
          SPREADSHEET_ID: 1kAD1ASXaaqrBmNHDVMYgj_cfW8pFJPEiRCY8ENutAvQ
        run: python scripts/sync_sheet.py --key /tmp/sa-key.json --output data

      - name: Fill missing marketing content (full stock, X..CT)
        env:
          SPREADSHEET_ID: 1kAD1ASXaaqrBmNHDVMYgj_cfW8pFJPEiRCY8ENutAvQ
          USER_LLM_API_KEY: ${{ secrets.USER_LLM_API_KEY }}
          USER_LLM_BASE_URL: ${{ secrets.USER_LLM_BASE_URL }}
          USER_LLM_MODEL: ${{ secrets.USER_LLM_MODEL }}
        run: |
          if [ -n "$USER_LLM_API_KEY" ]; then
            python scripts/fill_missing.py --output data --write-back --key /tmp/sa-key.json
          else
            echo "USER_LLM_API_KEY not set; skipping marketing fill."
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --quiet --cached; then
            git commit -m "chore: auto-sync google sheet data"
            git push
          else
            echo "No changes to commit."
          fi
