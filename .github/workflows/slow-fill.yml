name: Slow Fill Google Sheet

on:
  workflow_dispatch:
    inputs:
      max_rows:
        description: Max rows to LLM-fill per run
        required: false
        default: "100"
        type: string
      tabs:
        description: Tabs to fill (space separated)
        required: false
        default: "diamond_stock jewellery_stock"
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: slow-fill
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread oauth2client

      - name: Restore service account key
        env:
          SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY secret is empty. Set it to the base64 of your service account key JSON."
            exit 1
          fi
          # Accept either raw JSON or base64 (whitespace/newlines tolerated).
          # Check for raw JSON FIRST, before stripping punctuation.
          SA_KEY_RAW=$(printf '%s' "$SA_KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ "${SA_KEY_RAW:0:1}" = "{" ]; then
            printf '%s\n' "$SA_KEY_RAW" > /tmp/sa-key.json
            echo "Secret is raw JSON"
          else
            # Strip any stray non-base64 chars that can sneak in when copying
            # a wrapped long line (dashes, unicode, etc.).
            SA_KEY_B64=$(printf '%s' "$SA_KEY" | tr -d '[:space:]' | tr -cd 'A-Za-z0-9+/=')
            echo "Secret b64 length: ${#SA_KEY_B64}"
            # Restore base64 padding (=) lost during copy/paste
            while [ $(( ${#SA_KEY_B64} % 4 )) -ne 0 ]; do SA_KEY_B64="${SA_KEY_B64}="; done
            printf '%s' "$SA_KEY_B64" | base64 -d > /tmp/sa-key.json || {
              echo "::error::Secret is not valid base64 and not raw JSON. Set GOOGLE_SERVICE_ACCOUNT_KEY to base64 -w0 of your service account key JSON."
              exit 1
            }
          fi
          python -c "import json; json.load(open('/tmp/sa-key.json'))" || {
            echo "::error::Restored key is not valid JSON."
            exit 1
          }
          chmod 600 /tmp/sa-key.json
          python -c "import json; print('Service account email:', json.load(open('/tmp/sa-key.json'))['client_email'])"

      - name: Run slow fill + auto-fix + check
        env:
          SPREADSHEET_ID: 1kAD1ASXaaqrBmNHDVMYgj_cfW8pFJPEiRCY8ENutAvQ
          USER_LLM_API_KEY: ${{ secrets.USER_LLM_API_KEY }}
          USER_LLM_BASE_URL: ${{ secrets.USER_LLM_BASE_URL }}
          USER_LLM_MODEL: ${{ secrets.USER_LLM_MODEL }}
        run: |
          python scripts/agent.py --key /tmp/sa-key.json --output data \
            --tabs ${{ inputs.tabs || 'diamond_stock jewellery_stock' }} \
            --stages fix fill check --max-rows ${{ inputs.max_rows || '3' }} --no-commit

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --quiet --cached; then
            git commit -m "chore: slow-fill google sheet data"
          fi
          git pull --rebase origin main
          git push
